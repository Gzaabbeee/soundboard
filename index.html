<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soundboard</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1c1c1a;--muted:#6b6a64;--border:#dcdad2;--accent:#e8590c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#232321;--text:#f1f0ea;--muted:#9a988f;--border:#3a3935;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171716;--card:#232321;--text:#f1f0ea;--muted:#9a988f;--border:#3a3935;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:24px;margin:8px 0 4px}
p.sub{margin:0 0 16px;color:var(--muted);font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:14px}
.bar button,.bar label.btn{font:inherit;font-size:14px;padding:9px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer}
.bar .primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.bar .on{outline:2px solid var(--accent)}
.vol{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:14px;color:var(--muted)}
input[type=range]{width:140px}
#volv{min-width:44px;text-align:right}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.pad{position:relative}
.pad>button.play{width:100%;min-height:96px;border:0;border-radius:16px;color:#fff;font:inherit;font-weight:600;font-size:15px;padding:10px;cursor:pointer;word-break:break-word;box-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .06s}
.pad>button.play:active,.pad>button.play.hit{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.25)}
.pad .x{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:2px solid var(--bg);background:#d6336c;color:#fff;font-size:15px;line-height:1;cursor:pointer;display:none;padding:0}
.edit .pad .x{display:block}
.pad input.nm{display:none;width:100%;margin-top:6px;font:inherit;font-size:14px;padding:7px 9px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text)}
.edit .pad input.nm{display:block}
.drop{outline:3px dashed var(--accent);outline-offset:4px}
.hint{margin-top:18px;color:var(--muted);font-size:13px}
</style></head>
<body><div class="wrap">
<h1>Soundboard</h1>
<p class="sub">Tap a button to play it. Add your own sounds with the button below, or drop audio files on this page.</p>
<div class="bar">
  <label class="btn primary">+ Add sounds<input id="file" type="file" accept="audio/*" multiple hidden></label>
  <button id="stop">Stop all</button>
  <button id="exp">Backup</button>
  <label class="btn">Restore<input id="imp" type="file" accept=".json,application/json" hidden></label>
  <button id="edit">Edit names</button>
  <div class="vol">Vol <input id="vol" type="range" min="0" max="5" step="0.05" value="1"> <span id="volv">100%</span></div>
</div>
<div id="grid"></div>
<p class="hint" id="hint"></p>
</div>
<script>
var grid=document.getElementById('grid'),hint=document.getElementById('hint');
var vol=document.getElementById('vol');
var ctx=null,playing=[],sounds=[],db=null,urls={};
function ac(){if(!ctx){var C=window.AudioContext||window.webkitAudioContext;ctx=new C();}if(ctx.state==='suspended')ctx.resume();return ctx;}
var builtins=[];
function openDB(cb){try{var r=indexedDB.open('soundboard',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('sounds',{keyPath:'id'});};
  r.onsuccess=function(){db=r.result;cb();};r.onerror=function(){cb();};}catch(e){cb();}}
function loadAll(cb){if(!db)return cb([]);try{var q=db.transaction('sounds').objectStore('sounds').getAll();
  q.onsuccess=function(){cb(q.result||[]);};q.onerror=function(){cb([]);};}catch(e){cb([]);}}
function save(rec){if(!db)return;try{db.transaction('sounds','readwrite').objectStore('sounds').put(rec);}catch(e){}}
function del(id){if(!db)return;try{db.transaction('sounds','readwrite').objectStore('sounds').delete(id);}catch(e){}}
function play(s,btn){
  btn.classList.add('hit');setTimeout(function(){btn.classList.remove('hit')},120);
  if(s.fn){s.fn();return;}
  var a=new Audio(urls[s.id]);playing.push(a);
  try{var c=ac(),src=c.createMediaElementSource(a),g=c.createGain();g.gain.value=parseFloat(vol.value);src.connect(g);g.connect(c.destination);a._g=g;}catch(e){a.volume=Math.min(1,parseFloat(vol.value));}
  a.onended=function(){playing=playing.filter(function(x){return x!==a})};
  a.play().catch(function(){});
}
function render(){
  grid.innerHTML='';
  var all=builtins.concat(sounds);
  all.forEach(function(s,i){
    var w=document.createElement('div');w.className='pad';
    var b=document.createElement('button');b.className='play';b.textContent=s.name;
    b.style.background='hsl('+((i*47)%360)+' 62% 42%)';
    b.addEventListener('pointerdown',function(e){e.preventDefault();play(s,b);});
    b.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();play(s,b);}});
    w.appendChild(b);
    if(!s.fn){var x=document.createElement('button');x.className='x';x.textContent='\u00d7';x.setAttribute('aria-label','Remove '+s.name);
      x.onclick=function(){URL.revokeObjectURL(urls[s.id]);delete urls[s.id];sounds=sounds.filter(function(z){return z.id!==s.id});del(s.id);render();};
      var n=document.createElement('input');n.className='nm';n.value=s.name;n.setAttribute('aria-label','Name');
      n.oninput=function(){s.name=n.value;b.textContent=n.value||'Untitled';};
      n.onchange=function(){save(s);};
      w.appendChild(n);w.appendChild(x);}
    grid.appendChild(w);
  });
  if(!all.length)grid.innerHTML='<p class="hint">No sounds yet. Tap “+ Add sounds” to get started.</p>';
  hint.textContent=db?'Your added sounds are saved on this device.':'Saving isn\u2019t available here, so added sounds will disappear when you close the page.';
}
function addFiles(files){
  Array.prototype.forEach.call(files,function(f){
    if(!/^audio\//.test(f.type)&&!/\.(mp3|wav|ogg|m4a|aac|flac|webm)$/i.test(f.name))return;
    var rec={id:'u'+Date.now()+Math.random().toString(36).slice(2,7),name:f.name.replace(/\.[^.]+$/,''),blob:f};
    urls[rec.id]=URL.createObjectURL(f);sounds.push(rec);save(rec);
  });
  render();
}
document.getElementById('file').addEventListener('change',function(e){addFiles(e.target.files);e.target.value='';});
vol.addEventListener('input',function(){document.getElementById('volv').textContent=Math.round(vol.value*100)+'%';playing.forEach(function(a){if(a._g)a._g.gain.value=parseFloat(vol.value);});});
document.getElementById('stop').onclick=function(){playing.forEach(function(a){a.pause()});playing=[];};
var eb=document.getElementById('edit');
eb.onclick=function(){var on=document.body.classList.toggle('edit');eb.classList.toggle('on',on);eb.textContent=on?'Done':'Edit names';};
['dragover','dragenter'].forEach(function(n){window.addEventListener(n,function(e){e.preventDefault();document.body.classList.add('drop');});});
['dragleave','drop'].forEach(function(n){window.addEventListener(n,function(e){e.preventDefault();document.body.classList.remove('drop');});});
window.addEventListener('drop',function(e){if(e.dataTransfer&&e.dataTransfer.files)addFiles(e.dataTransfer.files);});
function toB64(b){return new Promise(function(r){var f=new FileReader();f.onload=function(){r(f.result)};f.readAsDataURL(b);});}
function fromB64(d){var p=d.split(','),m=(p[0].match(/:(.*?);/)||[0,'audio/mpeg'])[1],bin=atob(p[1]),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:m});}
document.getElementById('exp').onclick=function(){
  if(!sounds.length)return;
  Promise.all(sounds.map(function(s){return toB64(s.blob).then(function(d){return {name:s.name,data:d};});})).then(function(list){
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(list)],{type:'application/json'}));
    a.download='soundboard-backup.json';document.body.appendChild(a);a.click();a.remove();
  });
};
document.getElementById('imp').addEventListener('change',function(e){
  var f=e.target.files[0];e.target.value='';if(!f)return;
  f.text().then(function(t){JSON.parse(t).forEach(function(x){
    var b=fromB64(x.data),rec={id:'u'+Date.now()+Math.random().toString(36).slice(2,7),name:x.name,blob:b};
    urls[rec.id]=URL.createObjectURL(b);sounds.push(rec);save(rec);});render();}).catch(function(){});
});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
openDB(function(){loadAll(function(rows){rows.forEach(function(r){urls[r.id]=URL.createObjectURL(r.blob);});sounds=rows;render();});});
</script></body></html>
